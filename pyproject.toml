[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-microservice-rca"
version = "0.1.0"
description = "A reproducible university baseline for microservice root cause localization"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
